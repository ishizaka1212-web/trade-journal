<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b111b"><title>売買ジャーナル</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Yu Gothic',sans-serif;color:#edf3ff;background:#0b111b}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{padding:20px 16px 8px;max-width:960px;margin:auto}h1{font-size:23px;margin:0 0 7px}.muted{color:#a1b1c7;font-size:13px}.tabs{display:flex;gap:8px;padding:12px 16px;position:sticky;top:0;background:#0b111bf2;z-index:4;max-width:960px;margin:auto}.tabs button{flex:1}button,.btn{background:#1a2b44;border:1px solid #344a69;color:#edf3ff;border-radius:12px;padding:11px 12px;font-size:14px;font-weight:700;cursor:pointer}button.active,.primary{background:#2662d8;border-color:#2662d8}button.danger{background:#49222b;border-color:#8c4252}main{max-width:960px;margin:auto;padding:8px 16px 50px}.panel{background:#121e2c;border:1px solid #304157;border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{display:block;font-size:13px;color:#aebfd5;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #465771;background:#0b1523;color:white;border-radius:9px;padding:12px;font-size:16px}textarea{min-height:85px;resize:vertical}.amount{font-size:22px;font-weight:800;color:#80dfaf}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;background:#203a5b}.buy{color:#8de4af}.sell{color:#ffa5a5}.notice{font-size:12px;color:#b3c3d7}.error{color:#ffb2b2}.stat{font-size:22px;font-weight:800}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:550px}td,th{padding:11px 9px;text-align:left;border-bottom:1px solid #304157;font-size:13px}th{color:#aebfd5}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.entry{border-top:1px solid #304157;padding:12px 0}.entry:first-child{border-top:0}.entry p{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0;font-size:13px}.tag{font-size:12px;color:#9db2cd}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.summary .panel{margin:0}.negative{color:#ffa5a5}.positive{color:#8de4af}@media(max-width:550px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.stat{font-size:19px}h1{font-size:21px}}
</style></head><body><header><h1>🐶 売買ジャーナル</h1><div class="muted">買い・売りの理由と感情を、取引ごとに記録</div></header><nav class="tabs"><button data-tab="form" class="active">取引を登録</button><button data-tab="history">取引履歴</button><button data-tab="positions">保有残高</button></nav><main>
<section id="form" class="tab"><div class="panel"><form id="tradeForm"><input type="hidden" id="editId"><div class="grid"><div><label for="side">取引区分</label><select id="side"><option value="buy">買い</option><option value="sell">売り</option></select></div><div><label for="date">約定日</label><input id="date" type="date" required></div><div><label for="code">銘柄コード</label><input id="code" placeholder="例：7203" maxlength="12" required></div><div><label for="name">銘柄名</label><input id="name" placeholder="例：トヨタ自動車" required></div><div><label for="qty">株数</label><input id="qty" type="number" min="0.0001" step="any" inputmode="decimal" required></div><div><label for="price">約定単価（円）</label><input id="price" type="number" min="0" step="any" inputmode="decimal" required></div><div class="full"><label>取引金額（株数 × 約定単価）</label><div class="amount" id="amount">0円</div><div class="notice">手数料・税金を含まない約定金額です。</div></div><div class="full"><label id="reasonLabel" for="reason">買い理由</label><textarea id="reason" placeholder="根拠、エントリー条件、想定シナリオなど"></textarea></div><div class="full"><label for="emotion">取引時の感情</label><textarea id="emotion" placeholder="焦り、不安、自信、冷静さ、期待など"></textarea></div><div class="full"><label for="memo">補足メモ（任意）</label><textarea id="memo" placeholder="あとで振り返りたいこと"></textarea></div></div><p id="formError" class="error" role="alert"></p><div class="actions"><button class="primary" type="submit" id="submitBtn">取引を保存</button><button type="button" id="resetBtn">入力をクリア</button></div></form></div><div class="panel notice">データはこの端末のブラウザー内に保存されます。端末変更・ブラウザーデータ削除に備えて、定期的にCSVバックアップを保存してください。</div></section>
<section id="history" class="tab hidden"><div class="panel"><div class="row"><strong>取引履歴</strong><div class="actions"><button id="exportBtn">CSV出力</button><button id="importBtn">CSV読込</button><input type="file" id="importFile" accept=".csv,text/csv" class="hidden"></div></div><div class="grid" style="margin-top:12px"><div><label for="filterCode">銘柄で絞り込み</label><input id="filterCode" placeholder="コードまたは銘柄名"></div><div><label for="filterSide">取引区分</label><select id="filterSide"><option value="">すべて</option><option value="buy">買い</option><option value="sell">売り</option></select></div></div><div id="historyList" style="margin-top:12px"></div></div></section>
<section id="positions" class="tab hidden"><div class="summary"><div class="panel"><div class="muted">保有銘柄数</div><div class="stat" id="positionCount">0</div></div><div class="panel"><div class="muted">累計保有株数</div><div class="stat" id="shareCount">0</div></div></div><div class="panel"><strong>銘柄別の買い・売り・残高</strong><div class="notice" style="margin-top:6px">買付株数 − 売却株数を集計。株式分割・移管・手数料・税金は自動反映しません。</div><div class="tablewrap" id="positionTable" style="margin-top:12px"></div></div></section>
</main><script>
(()=>{'use strict';const KEY='stock_trade_journal_v1';let trades=[];const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('ja-JP',{maximumFractionDigits:4}),yen=n=>fmt(n)+'円',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function load(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');trades=Array.isArray(a)?a.filter(x=>x&&x.id&&['buy','sell'].includes(x.side)):[]}catch{trades=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(trades))}function amount(){const q=Number($('qty').value),p=Number($('price').value);$('amount').textContent=yen(Number.isFinite(q*p)?q*p:0)}function reset(){ $('tradeForm').reset();$('editId').value='';$('date').value=today();$('submitBtn').textContent='取引を保存';$('formError').textContent='';$('reasonLabel').textContent='買い理由';amount()}function tabs(t){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('hidden',e.id!==t));document.querySelectorAll('[data-tab]').forEach(e=>e.classList.toggle('active',e.dataset.tab===t));if(t==='history')renderHistory();if(t==='positions')renderPositions();window.scrollTo({top:0,behavior:'instant'})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tabs(b.dataset.tab));$('side').onchange=()=>$('reasonLabel').textContent=$('side').value==='buy'?'買い理由':'売り理由';$('qty').oninput=amount;$('price').oninput=amount;$('resetBtn').onclick=reset;
function positions(excludeId=''){const m=new Map();for(const t of trades){if(t.id===excludeId)continue;const k=t.code.trim().toUpperCase();if(!m.has(k))m.set(k,{code:k,name:t.name,bought:0,sold:0,buyAmount:0,sellAmount:0});const x=m.get(k);x.name=t.name||x.name;if(t.side==='buy'){x.bought+=Number(t.qty);x.buyAmount+=Number(t.qty)*Number(t.price)}else{x.sold+=Number(t.qty);x.sellAmount+=Number(t.qty)*Number(t.price)}}return m}
$('tradeForm').onsubmit=e=>{e.preventDefault();$('formError').textContent='';const id=$('editId').value,side=$('side').value,code=$('code').value.trim().toUpperCase(),name=$('name').value.trim(),qty=Number($('qty').value),price=Number($('price').value),date=$('date').value;if(!code||!name||!date||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0){$('formError').textContent='入力内容を確認してね。';return}const t={id:id||('t'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)),side,code,name,qty,price,date,reason:$('reason').value,emotion:$('emotion').value,memo:$('memo').value};const other=trades.filter(x=>x.id!==id);const ledger=[...other,t].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));const balance=new Map();for(const x of ledger){const k=x.code;const v=(balance.get(k)||0)+(x.side==='buy'?Number(x.qty):-Number(x.qty));if(v < -0.000001){$('formError').textContent=`${k}：${x.date}時点の保有株数を超える売却になります。過去の買付を登録してから保存してね。`;return}balance.set(k,v)}if(id){const idx=trades.findIndex(x=>x.id===id);if(idx<0)return;trades[idx]=t}else trades.push(t);save();reset();tabs('history')};
function renderHistory(){const q=$('filterCode').value.trim().toLowerCase(),side=$('filterSide').value;const rows=trades.filter(t=>(!side||t.side===side)&&(!q||t.code.toLowerCase().includes(q)||t.name.toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));$('historyList').innerHTML=rows.length?rows.map(t=>`<div class="entry"><div class="row"><strong>${esc(t.date)} <span class="${t.side}">${t.side==='buy'?'買い':'売り'}</span> ${esc(t.code)} ${esc(t.name)}</strong><span class="pill">${yen(t.qty*t.price)}</span></div><p>${fmt(t.qty)}株 × ${yen(t.price)}</p><p><span class="tag">${t.side==='buy'?'買い理由':'売り理由'}</span> ${esc(t.reason||'未入力')}</p><p><span class="tag">感情</span> ${esc(t.emotion||'未入力')}</p>${t.memo?`<p><span class="tag">メモ</span> ${esc(t.memo)}</p>`:''}<div class="actions"><button data-edit="${esc(t.id)}">編集</button><button class="danger" data-delete="${esc(t.id)}">削除</button></div></div>`).join(''):'<p class="muted">該当する取引はありません。</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(b.dataset.delete))}function edit(id){const t=trades.find(x=>x.id===id);if(!t)return;for(const k of ['id','side','date','code','name','qty','price','reason','emotion','memo'])$(k==='id'?'editId':k).value=t[k]??'';$('reasonLabel').textContent=t.side==='buy'?'買い理由':'売り理由';$('submitBtn').textContent='変更を保存';amount();tabs('form')}function del(id){const t=trades.find(x=>x.id===id);if(!t||!confirm(`${t.date} ${t.name} の${t.side==='buy'?'買い':'売り'}記録を削除しますか？`))return;const copy=trades.filter(x=>x.id!==id).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));const balance=new Map();for(const x of copy){const v=(balance.get(x.code)||0)+(x.side==='buy'?Number(x.qty):-Number(x.qty));if(v< -0.000001){alert('この取引を削除すると、売却株数が保有株数を超えてしまいます。関連する売却履歴を先に修正してください。');return}balance.set(x.code,v)}trades=copy;save();renderHistory()}
$('filterCode').oninput=renderHistory;$('filterSide').onchange=renderHistory;function renderPositions(){const all=[...positions().values()].sort((a,b)=>a.code.localeCompare(b.code,'ja',{numeric:true}));const open=all.filter(x=>x.bought-x.sold>0.000001);$('positionCount').textContent=fmt(open.length);$('shareCount').textContent=fmt(open.reduce((s,x)=>s+x.bought-x.sold,0));$('positionTable').innerHTML=all.length?`<table><thead><tr><th>銘柄</th><th>買付</th><th>売却</th><th>保有残</th><th>累計買付額</th><th>累計売却額</th></tr></thead><tbody>${all.map(x=>`<tr><td>${esc(x.code)}<br>${esc(x.name)}</td><td>${fmt(x.bought)}</td><td>${fmt(x.sold)}</td><td class="${x.bought-x.sold>0?'positive':''}"><b>${fmt(Math.max(0,x.bought-x.sold))}</b></td><td>${yen(x.buyAmount)}</td><td>${yen(x.sellAmount)}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">取引を登録するとここに残高が表示されます。</p>'}
function csvEscape(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}const HEAD=['ID','約定日','区分','銘柄コード','銘柄名','株数','約定単価','取引金額','売買理由','感情','メモ'];$('exportBtn').onclick=()=>{const lines=[HEAD,...trades.map(t=>[t.id,t.date,t.side==='buy'?'買い':'売り',t.code,t.name,t.qty,t.price,t.qty*t.price,t.reason,t.emotion,t.memo])].map(r=>r.map(csvEscape).join(','));const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='売買ジャーナル_'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBtn').onclick=()=>$('importFile').click();function parseCsv(s){s=s.replace(/^\ufeff/,'');const rows=[];let row=[],v='',quote=false;for(let i=0;i<s.length;i++){const c=s[i];if(quote){if(c==='"'&&s[i+1]==='"'){v+='"';i++}else if(c==='"')quote=false;else v+=c}else if(c==='"')quote=true;else if(c===','){row.push(v);v=''}else if(c==='\n'){row.push(v.replace(/\r$/,''));rows.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);rows.push(row)}return rows}$('importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const rows=parseCsv(await file.text());if(HEAD.some((h,i)=>rows[0]?.[i]!==h))throw Error('このアプリで出力したCSVを指定してください。');const added=rows.slice(1).filter(r=>r.length>=11).map(r=>({id:r[0],date:r[1],side:r[2]==='買い'?'buy':r[2]==='売り'?'sell':'',code:r[3].trim().toUpperCase(),name:r[4],qty:Number(r[5]),price:Number(r[6]),reason:r[8],emotion:r[9],memo:r[10]}));if(added.some(t=>!t.id||!t.date||!t.code||!t.name||!['buy','sell'].includes(t.side)||!Number.isFinite(t.qty)||t.qty<=0||!Number.isFinite(t.price)||t.price<0))throw Error('CSVに不正なデータがあります。');const map=new Map(trades.map(t=>[t.id,t]));added.forEach(t=>map.set(t.id,t));const merged=[...map.values()].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));const balances=new Map();for(const t of merged){const v=(balances.get(t.code)||0)+(t.side==='buy'?t.qty:-t.qty);if(v< -0.000001)throw Error('売却株数が保有株数を超えるデータがあります。');balances.set(t.code,v)}if(!confirm(`CSVの${added.length}件を読み込みます。同じIDは上書きされます。続けますか？`))return;trades=merged;save();renderHistory();alert('CSVを読み込みました。')}catch(err){alert('読込エラー：'+err.message)}finally{e.target.value=''}};load();reset();renderPositions()})();
</script></body></html>
